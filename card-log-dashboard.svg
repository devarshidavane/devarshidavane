<title id="t">SOC Log Analysis Dashboard</title>
<desc id="d">SIEM-style dashboard that flags Windows Event Log anomalies and maps them to MITRE ATT&amp;CK techniques. Stack: Python, Windows Event Logs, MITRE ATT&amp;CK. Status: built.</desc>
<defs></defs>
