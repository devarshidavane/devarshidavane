<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 56" width="1000" height="56" role="img" aria-labelledby="t d">
<title id="t">Projects</title>
<desc id="d">Section heading: Projects</desc>
<defs><linearGradient id="p" x1="0" x2="1"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0"/><stop offset="1" stop-color="#9B8CFF"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{opacity:.15}50%{opacity:1}100%{opacity:.15}}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.c{opacity:1!important}}
@keyframes run{0%{transform:translateX(80px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(930px);opacity:0}}.pl{animation:run 5s ease-in-out infinite}</style>
<text x="2" y="32" font-size="24" font-weight="700" fill="#E6EEFB" letter-spacing="-.2">Projects</text><text x="998" y="32" text-anchor="end" class="m" font-size="13" fill="#8FA3C4">~/projects</text><line x1="0" y1="46.5" x2="1000" y2="46.5" stroke="#1D2B47"/><rect x="0" y="45" width="64" height="3" rx="1.5" fill="#9B8CFF"/><rect class="pl" x="0" y="45.5" width="48" height="2" fill="url(#p)"/>
</svg>
