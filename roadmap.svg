<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 128" width="1000" height="128" role="img" aria-labelledby="t d">
<title id="t">Planned projects</title>
<desc id="d">Planned projects: YARA Rule Generator, PE File Inspector, C2 Traffic Fingerprinter.</desc>
<defs></defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
