</style>
<rect x="0.5" y=".5" width="321.6666666666667" height="127" rx="10" fill="#0C1424" stroke="#1D2B47" stroke-dasharray="5 5"/><text x="18.0" y="32" font-size="16" font-weight="700" fill="#E6EEFB">YARA Rule Generator</text><text class="m" x="306.6666666666667" y="32" font-size="11.5" fill="#8FA3C4" text-anchor="end">planned</text><text x="18.0" y="58" font-size="13.5" fill="#8FA3C4">Turn features from malware samples</text><text x="18.0" y="77" font-size="13.5" fill="#8FA3C4">into detection rules in YARA format.</text><rect x="18" y="90" width="61" height="22" rx="6" fill="none" stroke="#9B8CFF" stroke-opacity=".55"/><text class="m" x="49" y="105" font-size="11.5" fill="#E6EEFB" text-anchor="middle">Python</text><rect x="87" y="90" width="48" height="22" rx="6" fill="none" stroke="#9B8CFF" stroke-opacity=".55"/><text class="m" x="111" y="105" font-size="11.5" fill="#E6EEFB" text-anchor="middle">YARA</text><rect x="339.1666666666667" y=".5" width="321.6666666666667" height="127" rx="10" fill="#0C1424" stroke="#1D2B47" stroke-dasharray="5 5"/><text x="356.6666666666667" y="32" font-size="16" font-weight="700" fill="#E6EEFB">PE File Inspector</text><text class="m" x="645.3333333333334" y="32" font-size="11.5" fill="#8FA3C4" text-anchor="end">planned</text><text x="356.6666666666667" y="58" font-size="13.5" fill="#8FA3C4">Inspect Windows executable headers,</text><text x="356.6666666666667" y="77" font-size="13.5" fill="#8FA3C4">sections and imports for analysis.</text><rect x="357" y="90" width="61" height="22" rx="6" fill="none" stroke="#38E8FF" stroke-opacity=".55"/><text class="m" x="387" y="105" font-size="11.5" fill="#E6EEFB" text-anchor="middle">Python</text><rect x="426" y="90" width="61" height="22" rx="6" fill="none" stroke="#38E8FF" stroke-opacity=".55"/><text class="m" x="457" y="105" font-size="11.5" fill="#E6EEFB" text-anchor="middle">pefile</text><rect x="677.8333333333334" y=".5" width="321.6666666666667" height="127" rx="10" fill="#0C1424" stroke="#1D2B47" stroke-dasharray="5 5"/><text x="695.3333333333334" y="32" font-size="16" font-weight="700" fill="#E6EEFB">C2 Traffic Fingerprinter</text><text class="m" x="984.0" y="32" font-size="11.5" fill="#8FA3C4" text-anchor="end">planned</text><text x="695.3333333333334" y="58" font-size="13.5" fill="#8FA3C4">Fingerprint command-and-control</text><text x="695.3333333333334" y="77" font-size="13.5" fill="#8FA3C4">patterns in network captures.</text><rect x="695" y="90" width="61" height="22" rx="6" fill="none" stroke="#FFB547" stroke-opacity=".55"/><text class="m" x="726" y="105" font-size="11.5" fill="#E6EEFB" text-anchor="middle">Python</text><rect x="765" y="90" width="54" height="22" rx="6" fill="none" stroke="#FFB547" stroke-opacity=".55"/><text class="m" x="792" y="105" font-size="11.5" fill="#E6EEFB" text-anchor="middle">scapy</text>
