<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 298" width="1000" height="298" role="img" aria-labelledby="t d">
<title id="t">Skills</title>
<desc id="d">Skills: Log analysis, SIEM concepts, Windows Event Logs, IOC identification, Incident response, Threat intelligence, SOC operations, Static analysis, Dynamic analysis, VirusTotal, MalwareBazaar, Any.run, Burp Suite, VAPT, Web app testing, Wireshark, Nmap, MITRE ATT&amp;CK, OWASP, Python, Bash, JavaScript, Kali Linux, Linux, Windows</desc>
<defs></defs>
<style>
